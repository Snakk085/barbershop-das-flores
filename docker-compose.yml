version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: barbershop_postgres
    restart: always
    environment:
      POSTGRES_USER: barber_user
      POSTGRES_PASSWORD: barber_password
      POSTGRES_DB: barbershop_flores
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: barbershop_redis
    restart: always
    ports:
      - "6379:6379"

  evolution_api:
    image: atendai/evolution-api:v1.8.2
    container_name: barbershop_evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=barbershop_flores_secret_token_2026
    depends_on:
      - redis

volumes:
  postgres_data:
