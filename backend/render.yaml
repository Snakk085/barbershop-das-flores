services:
  - type: web
    name: barbershop-das-flores-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barbershop-flores-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

databases:
  - name: barbershop-flores-db
    plan: free
    databaseName: barbershop_flores
    user: barber_admin
